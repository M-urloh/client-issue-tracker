<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Clients</title>
</head>

<body>
    <h1>Clients</h1>
    <form th:action="@{/clients}" method="post">
        <label for="name">Client name</label>
        <input id="name" name="name" type="text" th:value="${enteredName}">
        <button type="submit">Add client</button>
    </form>

    <p th:if="${error}" th:text="${error}"></p>

    <p th:if="${#lists.isEmpty(clients)}">No clients yet.</p>

    <ul>
        <li th:each="client : ${clients}">
            <span th:text="${client.name}"></span>
            <a th:href="@{/clients/{id}/edit(id=${client.id})}">Edit</a>
        </li>
    </ul>
</body>

</html>
